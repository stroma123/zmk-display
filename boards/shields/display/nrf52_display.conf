CONFIG_USB_DEVICE_MANUFACTURER="stroma"
CONFIG_USB_DEVICE_VID=0xBABA
CONFIG_USB_DEVICE_PID=0x6969
CONFIG_USB_DEVICE_PRODUCT="nrf52 display"

CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=y

# st7735s reset is on P0.09 (NFC antenna pin); route NFCT pins to GPIO
CONFIG_NFCT_PINS_AS_GPIOS=y

# battery gauge widget (nice_nano_v2 has the VDDH divider sensor);
# defaults to n on BLE-less builds
CONFIG_ZMK_BATTERY_REPORTING=y

CONFIG_ZMK_KSCAN_MATRIX_POLLING=y 
CONFIG_ZMK_EXT_POWER=n 

CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
# CONFIG_DISPLAY_LOG_LEVEL_DBG=n
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000

CONFIG_ZMK_SLEEP=n 

# ZMK Studio support
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
